name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, epic/8056-modules-wiring]
  workflow_dispatch:

jobs:
  version-sync:
    name: Version Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check version sync
        run: node scripts/check-version-sync.js

  launcher:
    name: Launcher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Run launcher tests
        run: pnpm run test:launcher

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Format check
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check

      - name: Clippy check
        run: cargo clippy --manifest-path cli/Cargo.toml -- -D warnings

      - name: Run Rust tests
        run: cargo test --profile ci --manifest-path cli/Cargo.toml

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --filter dashboard
        working-directory: packages/dashboard

      - name: Build dashboard
        run: pnpm build
        working-directory: packages/dashboard

  sandbox-package:
    name: Sandbox Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test sandbox package
        run: pnpm --filter @agent-browser/sandbox test

  eve-package:
    name: Eve Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Eve package
        run: pnpm --filter @agent-browser/eve typecheck

      - name: Test Eve package
        run: pnpm --filter @agent-browser/eve test

  rust-cross:
    name: Rust (${{ matrix.os }} - ${{ matrix.target }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Run Rust tests
        run: cargo test --profile ci --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

  windows-dashboard-cli-diagnostic:
    name: Windows dashboard CLI diagnostic
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      AGENT_BROWSER_DASHBOARD_DIAGNOSTICS: "1"
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Run dashboard lifecycle diagnostic
        shell: pwsh
        timeout-minutes: 17
        run: |
          New-Item -ItemType Directory -Force -Path cli/target | Out-Null
          cargo test --locked --profile ci --manifest-path cli/Cargo.toml --target x86_64-pc-windows-msvc --test dashboard_cli -- --nocapture 2>&1 | Tee-Object -FilePath cli/target/dashboard-cli-diagnostic.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dashboard-cli-diagnostic
          path: cli/target/dashboard-cli-diagnostic.log
          if-no-files-found: ignore

  windows-tabnew-regressions:
    name: Windows tab_new regressions
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Install Chrome
        shell: pwsh
        timeout-minutes: 10
        run: |
          New-Item -ItemType Directory -Force -Path cli/target | Out-Null
          cargo run --profile ci --locked --manifest-path cli/Cargo.toml -- install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run action parity regression
        shell: pwsh
        timeout-minutes: 8
        run: |
          cargo test --profile ci --locked --manifest-path cli/Cargo.toml --lib test_all_documented_actions_are_handled -- --nocapture 2>&1 | Tee-Object -FilePath cli/target/windows-tabnew-parity.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path cli/target/windows-tabnew-parity.log -Pattern '^running 1 test$' -Quiet)) { throw "The action parity filter did not run exactly one test." }

      - name: Run ignored active-controls E2E regression
        shell: pwsh
        timeout-minutes: 10
        run: |
          cargo test --profile ci --locked --manifest-path cli/Cargo.toml --lib e2e_tab_new_applies_network_controls_before_first_navigation -- --ignored --nocapture 2>&1 | Tee-Object -FilePath cli/target/windows-tabnew-active-controls.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path cli/target/windows-tabnew-active-controls.log -Pattern '^running 1 test$' -Quiet)) { throw "The active-controls E2E filter did not run exactly one test." }

      - name: Preserve tab_new regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-tabnew-regressions
          path: cli/target/windows-tabnew-*.log
          if-no-files-found: ignore

  windows-full-lib-diagnostic:
    name: Windows full library test diagnostic
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Run the unfiltered library suite with diagnostics
        shell: pwsh
        timeout-minutes: 35
        run: |
          New-Item -ItemType Directory -Force -Path cli/target | Out-Null
          cargo test --locked --profile ci --manifest-path cli/Cargo.toml --target x86_64-pc-windows-msvc --lib -- --nocapture 2>&1 | Tee-Object -FilePath cli/target/windows-full-lib-diagnostic.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path cli/target/windows-full-lib-diagnostic.log -Pattern '^running [1-9][0-9]* tests?$' -Quiet)) { throw "The unfiltered library test suite did not report a nonzero test count." }

      - name: Preserve full library diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-full-lib-diagnostic
          path: cli/target/windows-full-lib-diagnostic.log
          if-no-files-found: ignore

  native-e2e:
    name: Native E2E Tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Install Chrome
        run: |
          cargo run --manifest-path cli/Cargo.toml -- install --with-deps

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run e2e tests
        run: cargo test --profile ci --manifest-path cli/Cargo.toml e2e -- --ignored --test-threads=1

  windows-integration:
    name: Windows Integration Test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    needs: rust-cross

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build Rust CLI
        run: cargo build --release --manifest-path cli/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Copy CLI binary to bin directory
        run: |
          Copy-Item cli/target/x86_64-pc-windows-msvc/release/agent-browser.exe bin/agent-browser-win32-x64.exe

      - name: Test agent-browser install command
        run: |
          $env:PATH = "$pwd\bin;$env:PATH"
          for ($i = 1; $i -le 3; $i++) {
            bin/agent-browser-win32-x64.exe install
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Attempt $i failed, retrying in 10 seconds..."
            Start-Sleep -Seconds 10
          }
          exit 1
        shell: pwsh
        timeout-minutes: 10

      - name: Test daemon lifecycle (open, snapshot, close)
        run: |
          $env:PATH = "$pwd\bin;$env:PATH"
          Write-Host "--- Opening page ---"
          bin/agent-browser-win32-x64.exe open https://example.com
          if ($LASTEXITCODE -ne 0) { Write-Error "open failed"; exit 1 }
          Write-Host "--- Taking snapshot ---"
          $snapshot = bin/agent-browser-win32-x64.exe snapshot
          if ($LASTEXITCODE -ne 0) { Write-Error "snapshot failed"; exit 1 }
          Write-Host $snapshot
          Write-Host "--- Closing browser ---"
          bin/agent-browser-win32-x64.exe close
          if ($LASTEXITCODE -ne 0) { Write-Error "close failed"; exit 1 }
          Write-Host "--- Windows daemon lifecycle test passed ---"
        shell: pwsh
        timeout-minutes: 5

  global-install:
    name: Global Install (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    needs: rust-cross
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: agent-browser-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: agent-browser-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: agent-browser-win32-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build Rust CLI
        run: cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      - name: Copy CLI binary to bin directory (Unix)
        if: runner.os != 'Windows'
        run: cp cli/target/${{ matrix.target }}/release/agent-browser bin/${{ matrix.binary }}

      - name: Copy CLI binary to bin directory (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item cli/target/${{ matrix.target }}/release/agent-browser.exe bin/${{ matrix.binary }}

      - name: Test npm global install
        run: |
          npm pack
          npm install -g agent-browser-*.tgz
          agent-browser --version
        shell: bash

      - name: Verify symlink points to native binary (Unix)
        if: runner.os != 'Windows'
        run: |
          SYMLINK=$(npm prefix -g)/bin/agent-browser
          TARGET=$(readlink "$SYMLINK")
          echo "Symlink: $SYMLINK"
          echo "Target: $TARGET"
          if [[ "$TARGET" != *"${{ matrix.binary }}"* ]]; then
            echo "ERROR: Symlink should point to native binary, not JS wrapper"
            exit 1
          fi
          echo "Symlink correctly points to native binary"
        shell: bash

      - name: Verify shim points to native binary (Windows)
        if: runner.os == 'Windows'
        run: |
          $shimPath = "$(npm prefix -g)\agent-browser.cmd"
          $content = Get-Content $shimPath -Raw
          echo "Shim path: $shimPath"
          echo "Shim content:"
          echo $content
          if ($content -notmatch "agent-browser-win32-x64\.exe") {
            echo "ERROR: Shim should point to native .exe, not JS wrapper"
            exit 1
          }
          echo "Shim correctly points to native binary"
        shell: pwsh
